<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Index</title>
	<style>
		body {
			margin: 0; 
			padding: 0; 
			font-family: Arial;
		}

		.main-container {
			display: flex; 
			flex-direction: column; 
			height: 100vh;
		}

		.top-bar {
			flex-shrink: 0; 
			padding: 1.2rem 1rem; 
			border-bottom: 1px solid black;
		}

		.main-layout {
			display: flex; 
			flex: 1; 
			width: 100vw;
		}

		.main-content {
			flex: 1; 
			overflow-y: auto; 
			padding: 1rem; 
			display: flex; 
			justify-content: center; 
			align-items: center; 
			box-sizing: border-box;
		}

		.sidebar {
			flex: 0 0 320px; 
			overflow-y: auto; 
			padding: 1rem; 
			border-right: 1px solid black;
		}

		.waiting-screen {
			display: none;
		}
		.active {
			display: block;
		}

		form[name="task"] {
			display: flex; 
			flex-direction: column; 
			align-items: center; 
			gap: 10px;
		}

	</style>
</head>
<body>
	<div class="main-container">
		<div class="top-bar">
			<form name="user-form" style="display: inline;">
				<label for="username">Username</label>
				<input id="username" name="username" placeholder="Username" autocomplete="off" />
				<label for="tasktype">Task</label>
				<select id="tasktype" name="tasktype">
					<option value="" disabled selected>Select a room type</option>
					<option value="small_multiplication">Basic Multiplication Table</option>
					<option value="small_division">Basic Multiplication Table (Division)</option> 
					<option value="small_addition">Plus up to 10</option>
					<option value="mid_addition">Plus up to 100</option>
					<option value="large_addition">Plus up to ±100</option>
					<option value="small_subtraction">Minus up to 10</option>
					<option value="mid_subtraction">Minus up to 100</option>
					<option value="large_subtraction">Minus up to ±100</option>
					<option value="fraction_reduction">Reduce Fractions</option>
					<option value="easy_equations">Simple equations</option>
					<option value="medium_equations">Equations with parentheses</option>
					<option value="hard_equations">Difficult equations</option>
					<option value="random">Random</option>
				</select>
				<label for="roomname">Roomname</label>
				<input id="roomname" name="roomname" placeholder="Roomname" autocomplete="off" />
				<button type="submit">Join room</button>
			</form>
			 | 
			<button id="btn-leave">Leave room</button>
			 | 
			<span>Points: <span id="points">0</span></span>
		</div>

		<div id="main" class="main-layout">
			<div id="chat" class="sidebar">
				<form name="msg-form" style="display: flex; gap: 8px; width: 100%;">
					<input id="msg" name="msg" placeholder="Message" style="flex: 1" autocomplete="off" />
					<button type="submit" style="flex-shrink: 0;">Send</button>
				</form>
				<ul id="messages"></ul>
			</div>

			<div id="stage" class="main-content">
				<div class="waiting-screen active">
					<p style="text-align: center;">Enter your username, join a random or specific room, and wait for other members. <br />
					You can share the room name to invite other members.</p>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.socket.io/4.8.2/socket.io.min.js"></script>
	<script>
		(() => {
			const socket = io(); 
			let user = {};

			socket.on('message', data => {
				const li = document.createElement('li');
				li.textContent = data.msg;
				document.getElementById('messages').append(li);
			});

			socket.on('room', data => {
				if (data.state === 'open') {
					document.querySelector('#stage').innerHTML = `
						<div class="waiting-screen active">
							<p style="text-align: center;">Enter your username, 
							join a random or specific room, and wait for other members. <br />
							You can share the room name to invite other members.</p>
						</div>
					`;
				} else if (data.state === 'closed') {
					const elem = document.querySelector('.waiting-screen');
					elem && elem.classList.remove('active');
				}
				document.querySelector('form[name="user-form"]').roomname.value = data.code;
			});

			socket.on('task', data => {
				const html = `
				<form name="task">
					<div>
						<span>$$${data.task.latex}$$</span>
					</div>
					<div>
						<input type="text" name="result" value="" autocomplete="off" />
					</div>
					<div>
						<button type="submit" style="display: none;">Solve</button>
					</div>
				</form>
				`;

				const node = document.querySelector('#stage')

				MathJax.typesetClear([node]);
				node.innerHTML = html;
				MathJax.typesetPromise([node]).then(() => {
					// the new content has been typeset
				});

				const form = document.querySelector('form[name="task"]');
				form.addEventListener('submit', event => {
						event.preventDefault();
						const formData = new FormData(event.target);
						const result = formData.get('result');
						socket.emit('solve', { c: result })
					})
				form.result.focus();
			});

			socket.on('user', data => {
				Object.assign(user, data);
				document.querySelector('#points').innerText = 0;
			});

			socket.on('score', data => {
				if (user && user.sid === data.sid) {
					document.querySelector('#points').innerText = data.points;
				}
			});


			document.querySelector('form[name="user-form"]')
				.addEventListener('submit', event => {
					event.preventDefault();
					const formData = new FormData(event.target);
					const username = formData.get('username');
					const roomname = formData.get('roomname');
					const tasktype = formData.get('tasktype') || '';
					socket.emit('join', {username, roomname, tasktype});
				});

			document.getElementById('btn-leave')
				.addEventListener('click', () => {
					socket.emit('leave')
					Object.assign(user, {});
					document.querySelector('#stage').innerHTML = `
						<div class="waiting-screen active">
							<p style="text-align: center;">Enter your username, 
							join a random or specific room, and wait for other members. <br />
							You can share the room name to invite other members.</p>
						</div>
					`;
				});

			document.querySelector('form[name="msg-form"]')
				.addEventListener('submit', event => {
					event.preventDefault();
					const formData = new FormData(event.target);
					const message = formData.get('msg');
					socket.emit('message', {message});
					event.target.reset();
				}); 

		})();
	</script>
	<script>
		window.MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']],
				displayMath: [['$$', '$$'], ['\\[', '\\]']]
			},
			startup: {
				typeset: false, 

				ready() {
					MathJax.startup.defaultReady();
					MathJax.startup.document.options.a11y.inTabOrder = MathJax.startup.document.menu.settings.inTabOrder;
					const tab = MathJax.startup.document.menu.menu.findID('Options', 'InTabOrder').variable;
					tab.getting = () => this.getA11y('InTabOrder');
					tab.setter = (value) => {
						const menu = MathJax.startup.document.menu;
						menu.settings.inTabOrder = value;
						menu.setA11y({ inTabOrder: value });
						menu.setTabOrder(value)
						menu.saveUserSettings();
					}
				}
			},
			chtml: {
				mtextInheritFont: true, 
				matchFontHeight: true, 
				scale: 1.2, 
			},
			options: {
				enableMenu: false,
				menuOptions: {
					settings: {
						inTabOrder: false, 
						enrich: false, 
					}
				}
			},
			output: {
				// font: 'mathjax-newcm'
				// font: 'mathjax-asana'
				// font: 'mathjax-bonum'
				font: 'mathjax-dejavu'
				// font: 'mathjax-fira'
				// font: 'mathjax-modern'
				// font: 'mathjax-pagella'
				// font: 'mathjax-schola'
				// font: 'mathjax-stix2'
				// font: 'mathjax-termes'
				// font: 'mathjax-tex'
			},
		};
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</body>
</html>
